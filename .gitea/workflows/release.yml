name: release
# Releases are built and published on GitHub (.github/workflows/release.yml;
# DEVELOPMENT "Releasing"). This one only builds both archives when run by
# hand, publishing nothing: a `v*` tag that reaches the Gitea starts nothing.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build deps
        # media_kit_video links libmpv + epoxy via pkg-config. Runner images
        # differ: some run as root without sudo.
        run: |
          SUDO=sudo; [ "$(id -u)" = 0 ] && SUDO=
          $SUDO apt-get update
          $SUDO apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwayland-dev \
            liblzma-dev g++ libmpv-dev libepoxy-dev xz-utils unzip curl python3

      - name: Setup Flutter (stable)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Build tarball
        run: tool/package_linux.sh --no-upload

  windows:
    # yuuka-windows: host-mode runner (no containers), runs as SYSTEM, has
    # git + VS 2022 Build Tools but no bash/python — PowerShell and Dart
    # only. Checkout is plain git: that host's cached actions/checkout
    # clone was corrupt, and no `uses:` means no action cache to rot.
    runs-on: windows-latest
    steps:
      - name: Checkout
        shell: powershell
        run: |
          git init -q .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch -q --tags origin "$env:GITHUB_SHA"
          if ($LASTEXITCODE) { exit 1 }
          git checkout -q --force FETCH_HEAD

      - name: Setup Flutter
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/setup_flutter_windows.ps1

      - name: Build zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/package_windows.ps1
