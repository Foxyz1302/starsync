name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build deps
        # media_kit_video links libmpv + epoxy via pkg-config. Runner images
        # differ: some run as root without sudo.
        run: |
          SUDO=sudo; [ "$(id -u)" = 0 ] && SUDO=
          $SUDO apt-get update
          $SUDO apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev g++ libmpv-dev libepoxy-dev xz-utils unzip curl python3

      - name: Setup Flutter (stable)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Build tarball
        run: tool/package_linux.sh

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: tool/release_publish.sh "${{ github.ref_name }}"
