name: starsync
description: Starsync desktop app (repo sync_relay_project). One binary.
publish_to: none
version: 1.4.0
environment:
  sdk: '>=3.13.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  signals: ^7.0.0
  # The owner's media_kit fork, pinned to a tag: every media_kit package
  # from the same commit (DEVELOPMENT "Build"). The libs packages are the
  # Linux and Windows ones (mpv: the system's on Linux, a pinned build
  # fetched on Windows).
  media_kit:
    git:
      url: https://github.com/Foxyz1302/media-kit.git
      ref: v1.5.0-starsync.1
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/Foxyz1302/media-kit.git
      ref: v1.5.0-starsync.1
      path: media_kit_video
  media_kit_libs_linux:
    git:
      url: https://github.com/Foxyz1302/media-kit.git
      ref: v1.5.0-starsync.1
      path: libs/linux/media_kit_libs_linux
  media_kit_libs_windows_video:
    git:
      url: https://github.com/Foxyz1302/media-kit.git
      ref: v1.5.0-starsync.1
      path: libs/windows/media_kit_libs_windows_video
  path_provider: ^2.1.0
  # The Pictures known folder (screenshots); already in through path_provider.
  path_provider_windows: ^2.3.0
  web_socket_channel: ^3.0.0
  sync_relay_core:
    path: ../../packages/core
  sync_relay_server:
    path: ../../packages/server
  file_picker: ^13.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image: ^4.9.2
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  crypto: ^3.0.6
  ffi: ^2.1.0
  # Drag & drop and clipboard files/images (vendored desktop_drop + pasteboard).
  fox_utils:
    git:
      url: https://github.com/Foxyz1302/fox_utils.git
      ref: v0.1.10
  # LeafPopover (the Up next popover).
  leaf_widgets:
    git:
      url: https://github.com/Foxyz1302/leaf_widgets.git
      ref: v0.1.1
  # App sounds (sfx/, platform/audio/): SoLoud + miniaudio, built from
  # source by its build hook (needs only a C++ toolchain).
  flutter_soloud: ^5.2.1
  # System notifications (platform/desktop/desktop_notifications.dart):
  # Linux over D-Bus in pure Dart, Windows toasts through WinRT.
  flutter_local_notifications: ^22.3.0
# The sounds are WAVs made in memory: no Ogg/Opus/FLAC codecs, so the
# build hook downloads and bundles no Xiph libraries.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
# media_kit_video asks for media_kit from pub.dev; this makes it take the
# fork's, the same commit as above.
dependency_overrides:
  media_kit:
    git:
      url: https://github.com/Foxyz1302/media-kit.git
      ref: v1.5.0-starsync.1
      path: media_kit
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/shaders/anime4k/
    - assets/licenses/
    - assets/icon/
