name: starsync
description: Starsync desktop app (repo sync_relay_project). One binary.
publish_to: none
version: 1.4.0
environment:
  sdk: '>=3.13.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  signals: ^7.0.0
  media_kit: ^1.1.0
  # Vendored with Starsync's patches (third_party/media_kit_video/starsync).
  media_kit_video:
    path: ../../third_party/media_kit_video
  media_kit_libs_video: ^1.0.0
  path_provider: ^2.1.0
  web_socket_channel: ^3.0.0
  sync_relay_core:
    path: ../../packages/core
  sync_relay_server:
    path: ../../packages/server
  file_picker: ^13.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  image: ^4.9.2
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  crypto: ^3.0.6
  ffi: ^2.1.0
  # Drag & drop and clipboard files/images (vendored desktop_drop + pasteboard).
  fox_utils:
    git:
      url: https://git.example.org/Foxyz/fox_utils.git
      ref: v0.1.9
  # LeafPopover (the Up next popover).
  leaf_widgets:
    git:
      url: https://git.example.org/Foxyz/leaf_widgets.git
      ref: v0.1.0
  # App sounds (sfx/, platform/audio/): SoLoud + miniaudio, built from
  # source by its build hook (needs only a C++ toolchain).
  flutter_soloud: ^5.2.1
  # System notifications (platform/desktop/desktop_notifications.dart):
  # Linux over D-Bus in pure Dart, Windows toasts through WinRT.
  flutter_local_notifications: ^22.3.0
# The sounds are WAVs made in memory: no Ogg/Opus/FLAC codecs, so the
# build hook downloads and bundles no Xiph libraries.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/shaders/anime4k/
    - assets/icon/
