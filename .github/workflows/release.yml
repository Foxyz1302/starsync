name: release
on:
  # A release: build both platforms, then publish them to the tag's release.
  push:
    tags: ['v*']
  # A test build of the chosen branch: both platforms built, nothing
  # published; the archives are this run's artifacts.
  workflow_dispatch:

env:
  # The Flutter both builds use: a branch of github.com/flutter/flutter
  # (stable, beta) or a release tag (3.48.0-0.5.pre). stable is what Gitea
  # CI has always used; the owner picks. Keep ci.yml on the same value.
  FLUTTER_REF: stable

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The packager's Discord card shows the release commit's diffstat.
          fetch-depth: 0

      - name: Install Linux build deps
        # media_kit_video links libmpv + epoxy via pkg-config.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwayland-dev \
            liblzma-dev g++ libmpv-dev libepoxy-dev xz-utils unzip curl python3

      - uses: ./.github/actions/setup-flutter
        with:
          ref: ${{ env.FLUTTER_REF }}

      - name: Build tarball
        env:
          # Optional: set, a release's tarball is also posted to Discord.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tool/package_linux.sh
          else
            tool/package_linux.sh --no-upload
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: starsync-linux-x64
          path: dist/starsync-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter
        with:
          ref: ${{ env.FLUTTER_REF }}

      - name: Build zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/package_windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: starsync-windows-x64
          path: dist/starsync-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # One job publishes once both archives exist: no create race, and the
  # release never shows only one platform. The manifest goes up last.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          dart tool/publish_github.dart "$GITHUB_REF_NAME" \
            "dist/starsync-$VER-linux-x64.tar.gz" "dist/starsync-$VER-windows-x64.zip" \
            updates/manifest.json
